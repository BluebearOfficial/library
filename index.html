<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>图书馆</title>
</head>
<body>
  <h1>图书馆</h1>

  <h2>添加书目</h2>
  <form id="addForm">
    <input id="isbn" placeholder="ISBN（可空）" />
    <input id="title" placeholder="书名" required />
    <input id="author" placeholder="作者" required />
    <button type="submit">添加</button>
  </form>

  <h2>藏书</h2>
  <ul id="list">加载中…</ul>

  <script>
function loadBooks() {
  fetch('http://localhost:3000/api/books')
    .then(r => r.json())
    .then(d => {
      const ul = document.getElementById('list');
      ul.innerHTML = '';

      d.books.forEach(b => {
        const li = document.createElement('li');

        const info = document.createElement('span');
        info.textContent = `${b.title} — ${b.author}（可借 ${b.available} / 共 ${b.total}）`;

        const addCopyBtn = document.createElement('button');
        addCopyBtn.textContent = '加副本';
        addCopyBtn.style.marginLeft = '10px';
        addCopyBtn.onclick = () => addCopy(b.id);

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '删除';
        deleteBtn.style.marginLeft = '5px';
        deleteBtn.onclick = () => deleteBook(b.id);

        li.appendChild(info);
        li.appendChild(addCopyBtn);
        li.appendChild(deleteBtn);

        ul.appendChild(li);
      });
    });
}

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  await fetch('http://localhost:3000/api/books', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      isbn: document.getElementById('isbn').value,
      title: document.getElementById('title').value,
      author: document.getElementById('author').value,
    }),
  });

  document.getElementById('isbn').value = '';
  document.getElementById('title').value = '';
  document.getElementById('author').value = '';
  loadBooks();
});


async function addCopy(bookId) {
  await fetch(`http://localhost:3000/api/books/${bookId}/copies`, {
    method: 'POST',
  });
  loadBooks();
}

async function deleteBook(id) {
  if (!confirm('确定删除这本书吗？所有副本会一起删除。')) return;
  await fetch('http://localhost:3000/api/books/' + id, {
    method: 'DELETE',
  });
  loadBooks();
}



async function editBook(book) {
  const newTitle = prompt('书名：', book.title);
  if (newTitle === null) return;   // 点了取消

  const newAuthor = prompt('作者：', book.author);
  if (newAuthor === null) return;

  await fetch('http://localhost:3000/api/books/' + book.id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: newTitle, author: newAuthor }),
  });

  loadBooks();
}

loadBooks();  // 页面打开时加载


      document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const title = document.getElementById('title').value;
  const author = document.getElementById('author').value;

  await fetch('http://localhost:3000/api/books', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, author }),
  });

  // 清空输入框
  document.getElementById('title').value = '';
  document.getElementById('author').value = '';

  // 刷新列表
  loadBooks();
});
  </script>
</body>
</html>
